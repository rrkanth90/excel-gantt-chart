# fly.toml app configuration file generated for adiary on 2026-10-30T21:37:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'adiary'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  DIARY_MODE = 'shared'
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=160'
  PORT = '3000'
  TRUST_PROXY = 'true'

[[mounts]]
  source = 'diary_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
