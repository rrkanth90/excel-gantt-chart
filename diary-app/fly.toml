# Fly.io config for the diary (see README, "Deploy on Fly.io").
# `app` must be unique across Fly.io: `fly launch` lets you change it.
app = "my-diary"
# Pick the region closest to you: `fly platform regions` lists them.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"
  DIARY_MODE = "shared"
  PORT = "3000"
  NODE_OPTIONS = "--max-old-space-size=160"

# Entries, photos and backups live on this volume and survive deploys.
[mounts]
  source = "diary_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Sleep when nobody is using the diary and wake on the next visit
  # (a couple of seconds), so you mostly pay only for storage.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
